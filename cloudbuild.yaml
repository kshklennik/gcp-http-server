steps:
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'europe-west1-docker.pkg.dev/$PROJECT_ID/docker-repo/http-server:$COMMIT_SHA'
      - '.'

images:
  - 'europe-west1-docker.pkg.dev/$PROJECT_ID/docker-repo/http-server:$COMMIT_SHA'

options:
  logging: CLOUD_LOGGING_ONLY
